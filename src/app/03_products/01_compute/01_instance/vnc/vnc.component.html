<div class="vnc">
  <div class="vnc__header">
    <div class="vnc__header-status">
      <button matIconButton class="vnc__header-paste" (click)="refreshSession()"><mat-icon>refresh</mat-icon></button>
      <span #status></span>
    </div>
    <div class="vnc__header-actions">
      <button
        matButton="outlined"
        [matMenuTriggerFor]="guestLayoutMenu"
        aria-label="Guest keyboard layout"
        title="Disposition du clavier configurée dans la VM">
        Clavier VM : {{ guestLayoutShort() }}
      </button>
      <mat-menu #guestLayoutMenu="matMenu">
        @for (layout of guestLayouts; track layout.id) {
          <button mat-menu-item (click)="setGuestLayout(layout.id)">
            <mat-icon>{{ layout.id === guestLayout() ? 'radio_button_checked' : 'radio_button_unchecked' }}</mat-icon>
            {{ layout.label }}
          </button>
        }
      </mat-menu>
      <button matButton="outlined" class="vnc__header-paste" (click)="paste()">Coller</button>
      <button matButton="outlined" class="vnc__header-ctrlAltDel" (click)="sendCtrlAltDel()">Ctrl+Alt+Del</button>
      <button
        matIconButton
        (click)="toggleVirtualKeyboard()"
        [attr.aria-label]="showVirtualKeyboard() ? 'Hide virtual keyboard' : 'Show virtual keyboard'">
        <mat-icon>keyboard</mat-icon>
      </button>
    </div>
  </div>

  <div class="vnc__screen" #screen></div>

  @if (showVirtualKeyboard()) {
    <spx-virtual-keyboard [layout]="guestLayout()" (keyPress)="onVirtualKeyPress($event)" />
  }
</div>
